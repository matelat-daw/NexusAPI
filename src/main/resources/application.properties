# Application Configuration with Environment Variables for Security
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.application.name=NexusAPI
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SECURITY: All sensitive configs use environment variables with fallback defaults
# In production: set environment variables instead of using defaults!
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Anubis@68}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JWT Configuration
jwt.issuer=${JWT_ISSUER:NexusAstralisProject}
jwt.audience=${JWT_AUDIENCE:NexusAstralis}
jwt.secret=${JWT_SECRET:Th1s1sOurKeyPleaseD0ntT0uch1t1sOurs.}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nexus.astralis.project@gmail.com}
spring.mail.password=${MAIL_PASSWORD:boqigzandgseyfce}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.futureprograms.NexusAPI=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Caching
spring.cache.type=caffeine
spring.cache.cache-names=stars,constellations
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60m

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://127.0.0.1,https://nexus-railway.vercel.app}

# Actuator endpoints for health checks and metrics
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-post-size=10485760
server.tomcat.connection-timeout=20000

